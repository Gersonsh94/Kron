plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.kron.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.kron.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            // the library goes into the APK as kronc wrote it
            useLegacyPackaging true
        }
    }
}
