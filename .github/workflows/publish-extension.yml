name: Publish Kron Extension

on:
  push:
    branches:
      - main
    paths:
      - 'kron-lang/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Repository contents diagnostics
        run: |
          pwd
          ls -la
          
      - name: Install vsce
        run: npm install -g @vscode/vsce
          
      - name: Publish to VS Code Marketplace
        working-directory: ./kron-lang
        run: vsce publish -p ${{ secrets.VSCE_TOKEN }}